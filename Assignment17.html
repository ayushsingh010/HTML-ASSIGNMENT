<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ayush Singh's Job Application Form">
  <title>Ayush Singh - Job Application</title>
</head>

<body>
  <h1>Job Application – Front-End Developer</h1>

  <form action="#" method="post" enctype="multipart/form-data">

    <fieldset>
      <legend>Personal Details</legend>

      <p>
        <label for="fn">Full Name
          <input type="text" id="fn" name="fullname"
            value="Ayush Singh" required>
        </label>
      </p>

      <p>
        <label for="em">Email
          <input type="email" id="em" name="email"
            value="aayushthakur4455@gmail.com" required>
        </label>
      </p>

      <p>
        <label for="ph">Phone
          <input type="tel" id="ph" name="phone"
            value="9045689172" pattern="[0-9]{10}">
        </label>
      </p>

      <p>
        <label for="address">Address
          <input type="text" id="address" name="address"
            value="Aligarh, Uttar Pradesh">
        </label>
      </p>

      <p>
        <label for="web">Portfolio URL
          <input type="url" id="web" name="website"
            placeholder="https://">
        </label>
      </p>

      <p>
        <label for="pw">Create Password
          <input type="password" id="pw" name="password"
            minlength="8" placeholder="Create a password">
        </label>
      </p>
    </fieldset>

    <fieldset>
      <legend>Education Details</legend>

      <p>
        <label for="college">College
          <input type="text" id="college" name="college"
            value="Invertis University, Bareilly" readonly>
        </label>
      </p>

      <p>
        <label for="course">Course
          <input type="text" id="course" name="course"
            value="BCA (Artificial Intelligence)" readonly>
        </label>
      </p>

      <p>
        <label for="year">Current Year
          <input type="text" id="year" name="year"
            value="1st Year" readonly>
        </label>
      </p>
    </fieldset>

    <fieldset>
      <legend>Job Details</legend>

      <p>
        <label for="pos">Position
          <select id="pos" name="position">
            <option value="frontend" selected>Front-End Developer</option>
            <option value="web">Web Developer Intern</option>
            <option value="ui">UI Designer</option>
          </select>
        </label>
      </p>

      <p>
        <label for="join">Earliest Joining Date
          <input type="date" id="join" name="join">
        </label>
      </p>

      <p>
        <label for="slot">Interview Slot
          <input type="datetime-local" id="slot" name="slot">
        </label>
      </p>

      <p>
        <label for="mo">Preferred Start Month
          <input type="month" id="mo" name="month">
        </label>
      </p>

      <p>
        <label for="wk">Preferred Week
          <input type="week" id="wk" name="week">
        </label>
      </p>

      <p>
        <label for="tm">Best Call Time
          <input type="time" id="tm" name="time">
        </label>
      </p>

      <p>
        <label for="exp">Years of Experience
          <input type="number" id="exp" name="exp"
            min="0" max="40" value="0">
        </label>
      </p>

      <p>
        <label for="sal">Expected Salary (₹ LPA)
          <input type="range" id="sal" name="salary"
            min="2" max="30" value="6"
            oninput="out.value=this.value">
          <output id="out">6</output>
        </label>
      </p>

      <p>
        <label for="col">Favourite Colour
          <input type="color" id="col" name="colour"
            value="#3366ff">
        </label>
      </p>

      <p>
        <label for="sk">Skills
          <input list="skills" id="sk" name="skill"
            placeholder="Choose or type a skill">
          <datalist id="skills">
            <option value="Java"></option>
            <option value="HTML"></option>
            <option value="CSS"></option>
            <option value="JavaScript"></option>
            <option value="Git"></option>
          </datalist>
        </label>
      </p>

      <p>
        <label for="s">Search Company Policy
          <input type="search" id="s" name="q">
        </label>
      </p>
    </fieldset>

    <fieldset>
      <legend>Work Mode</legend>

      <label>
        <input type="radio" name="mode" value="onsite" checked>
        On-site
      </label>

      <label>
        <input type="radio" name="mode" value="remote">
        Remote
      </label>

      <label>
        <input type="radio" name="mode" value="hybrid">
        Hybrid
      </label>
    </fieldset>

    <fieldset>
      <legend>Technologies Known</legend>

      <label>
        <input type="checkbox" name="tech" value="java">
        Java
      </label>

      <label>
        <input type="checkbox" name="tech" value="html">
        HTML
      </label>

      <label>
        <input type="checkbox" name="tech" value="css">
        CSS
      </label>

      <label>
        <input type="checkbox" name="tech" value="js">
        JavaScript
      </label>
    </fieldset>

    <p>
      <label for="cv">Upload Résumé (PDF)
        <input type="file" id="cv" name="resume" accept=".pdf">
      </label>
    </p>

    <p>
      <label for="cover">Cover Letter<br>
        <textarea id="cover" name="cover"
          rows="5" cols="50" maxlength="500"
          placeholder="Write a short introduction about yourself"></textarea>
      </label>
    </p>

    <input type="hidden" name="source" value="careers-page">

    <p>
      <label>
        <input type="checkbox" name="agree" required>
        I confirm that the information is correct
      </label>
    </p>

    <input type="submit" value="Apply Now">
    <input type="reset" value="Reset">
    <input type="button" value="Print" onclick="window.print()">

  </form>

  <footer>
    <p>2026 Ayush Singh</p>
  </footer>

</body>

</html>
